name: paper-trade

# GitHub drops many scheduled runs, so each run loops for ~5.5h (paper/cron.py) and the schedule
# only has to fire now and then; the concurrency group queues the next loop behind the current one.
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "loop length in hours (0 = one pass)"
        default: "5.5"

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Loop hourly and daily tasks
        run: |
          git config user.name "paper-trade-bot"
          git config user.email "paper-trade-bot@users.noreply.github.com"
          python3 -m paper.cron "${{ inputs.hours || '5.5' }}"
